# ============================================================================
# Python 工作区定义（uv workspace）
# 管理所有后端 Python 包（packages/* + apps/*）与共享依赖解析。
# 单一真理源（SSOT）：接口契约来自 packages/schema/openapi.yaml，
# 后端 DTO 由 gen-py.sh 生成，禁止手写类型漂移。
# ============================================================================
[project]
name = "contract-guard-ai"
version = "1.0.0"
description = "基于大模型的企业合同智能审核与风险预警系统（Polyglot Monorepo 根）"
requires-python = ">=3.11"

dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "datamodel-code-generator>=0.25.0",
    "jsonschema>=4.22", # 校验 rag-contracts 导出的 JSON Schema
]

# ---------------------------------------------------------------------------
# 关键配置：标记根项目为非 Package 容器，防止 uv sync 尝试构建根包
# ---------------------------------------------------------------------------
[tool.uv]
package = false

# ---------------------------------------------------------------------------
# uv workspace：聚合 packages/* 与 apps/* 为单一可解析依赖图
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["packages/schema", "apps/web-ui"] # 显式排除纯 Node/TS 模块

# 工作区内包互相引用（editable）
[tool.uv.sources]
ai-engine = { workspace = true }
doc-processor = { workspace = true }
# RAG 三件套（T01/T02 新增）：契约层 → 可观测 → 核心实现
rag-contracts = { workspace = true }
cg-observability = { workspace = true }
rag-core = { workspace = true }

# ---------------------------------------------------------------------------
# Ruff：静态检查与格式化
# E/F 基础错误、I 导入排序、UP 语法升级、RUF 专项、BLE 盲捕获
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "BLE"]
# 降噪说明（必需，否则本仓库 ruff 不可用）：
# - E501        ：行宽交给 formatter 处理（ruff 官方建议二者取其一），且规范未定义行宽；
# - RUF001/002/003：docstring/注释/字符串中的"歧义 Unicode"。本项目 docstring 与注释
#                  **刻意使用中文全角标点**（：、，、（）、《》），属既定风格而非缺陷，
#                  全仓命中 ~2206 条，必须豁免。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# 缺此项时 ruff 会把 rag_contracts / rag_core 等 workspace 包判为第三方，
# 与本仓库"依赖 → 本地包之间留空行"的既有风格冲突，产生成片 I001 误报。
# 注意：此处登记的是**顶层模块名**，与包目录名不同（ai-engine 目录 → ai_engine 模块）。
# 其中 ai_engine 由 rag-core 的测试用例导入；其余 workspace 包随全仓统一时再补。
known-first-party = [
    "rag_core", "rag_contracts", "cg_observability",
    "ai_engine", "doc_processor", "app", "worker",
]

# ---------------------------------------------------------------------------
# mypy：类型检查
# uv 以"路径式 editable(.pth)"安装 workspace 兄弟包，而 mypy 不解析 .pth，
# 若不显式声明 mypy_path，跨包 import 会一律误报 [import-not-found]（实测 29 条），
# 导致类型检查结果不可信。T-A0-4 起登记**全部** workspace 包（原仅两个兄弟包）。
# 注：**刻意不固定 python_version**。若按 requires-python 下限写死 "3.11"，
# mypy 会以 3.11 语法解析依赖存根，numpy>=2.5 的 .pyi 使用 PEP 695 `type` 语句，
# 直接产生 `Type statement is only supported in Python 3.12+` 的语法错（实测），
# 使检查无法进行。故交给 mypy 沿用当前解释器版本（本机 3.13）。
# ---------------------------------------------------------------------------
[tool.mypy]
mypy_path = [
    "packages/rag-contracts",
    "packages/cg-observability",
    "packages/rag-core",
    "packages/ai-engine",
    "packages/doc-processor",
    "apps/api-gateway",
    "apps/async-worker",
]