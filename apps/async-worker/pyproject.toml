[project]
name = "async-worker"
version = "1.1.0"
description = "异步任务处理节点（Celery）：文档解析 / 批量审核 / 报告渲染"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4",
    "pydantic>=2.7",
    "ai-engine",
    "doc-processor",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv.sources]
ai-engine = { workspace = true }
doc-processor = { workspace = true }
