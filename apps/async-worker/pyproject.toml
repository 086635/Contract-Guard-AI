[project]
name = "async-worker"
version = "1.1.0"
description = "异步任务处理节点（Celery）：文档解析 / 批量审核 / 报告渲染"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.3,<6.0",         # T-A0-1：运行期必需（此前 .venv 内缺失，靠系统 Python 兜底）
    "redis>=5.0",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "minio>=7.2",
    "cg-observability",          # 日志 / 埋点唯一通道（直接 import，故显式声明）
    "ai-engine",
    "doc-processor",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv.sources]
ai-engine = { workspace = true }
doc-processor = { workspace = true }
cg-observability = { workspace = true }
