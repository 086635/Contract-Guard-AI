[project]
name = "api-gateway"
version = "1.1.0"
description = "后端主 REST API / Web API（FastAPI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "celery>=5.3,<6.0",
    "redis>=5.0",
    "qdrant-client>=1.9",
    "minio>=7.2",
    "ai-engine",
    "doc-processor",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
ai-engine = { workspace = true }
doc-processor = { workspace = true }
