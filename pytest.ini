[pytest]
; T-A0-4：固化测试配置，使「跑测试」变成一条命令。
; ⚠️ 2026-09-21 补 `apps/async-worker/tests`：T-C7 落盘了本仓**第一批 worker 用例**
;    （`1-1 §⑧` 的原清单写于 worker 零测试时，缺这一行会让"全量测试"静默漏掉整包）。

; ⚠️ pythonpath 全部用**相对仓库根**的路径（换机器不失效）；
;    `.venv/Lib/site-packages` 排第一：本机系统 Python 的 pydantic-core 与 pydantic 不匹配
;    （实测 SystemError），必须让 .venv 的第三方包先胜出，裸敲 pytest 才能跑。
;    非 Windows / 非 uv 布局时该目录不存在，pytest 会忽略缺失路径，不影响其它平台。
testpaths =
    packages/rag-contracts/tests
    packages/cg-observability/tests
    packages/rag-core/tests
    packages/ai-engine/tests
    packages/doc-processor/tests
    apps/api-gateway/app/api/v1/tests
    apps/async-worker/tests
pythonpath =
    .venv/Lib/site-packages
    packages/rag-contracts
    packages/cg-observability
    packages/rag-core
    packages/ai-engine
    packages/doc-processor
    apps/api-gateway
; `--durations=10`：打最慢 10 条用例。全量耗时的大头在 OCR 真实引擎路径与
;    全仓扫描守卫（实测 14 条用例占 88%），没有这个数字就无法区分
;    "变慢是新增代码还是机器负载"（见 AGENTS.md §8）。
addopts = -q --durations=10
