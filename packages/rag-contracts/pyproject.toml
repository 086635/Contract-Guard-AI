[project]
name = "rag-contracts"
version = "1.0.0"
description = "RAG 检索模块契约层：Pydantic v2 模型 + JSON Schema + 端口抽象（零重型依赖）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0", # 契约模型与校验（v2 API）
]

[project.optional-dependencies]
# 校验导出的 JSON Schema 时使用（仅测试环境需要）
dev = [
    "jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_contracts"]

[tool.uv.sources]
# 工作区内互相引用（契约层不依赖任何上层包，保持依赖方向单向）
