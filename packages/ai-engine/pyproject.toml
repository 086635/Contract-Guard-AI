[project]
name = "ai-engine"
version = "1.1.0"
description = "AI Agent 逻辑包：风险审核 / 条款重写 / 跨条款矛盾分析 + 分层 Memory + RAG"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2",           # AI Agent 编排（赛题要求）
    "openai>=1.30",             # LLM 调用
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_engine"]

[tool.uv.sources]
# 工作区内互相引用（如需）
