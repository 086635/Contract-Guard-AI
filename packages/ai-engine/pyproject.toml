[project]
name = "ai-engine"
version = "1.1.0"
description = "AI Agent 逻辑包：风险审核 / 条款重写 / 跨条款矛盾分析 + 分层 Memory + RAG"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=1.2,<2.0",      # AI Agent 编排（T-A0-3 收紧：原 ">=0.2" 与实测 1.2.11 脱节）
    "langchain-core>=1.6,<2.0", # 消息 / 工具抽象
    "openai>=3.3",              # LLM 调用
    "rag-contracts",            # workspace：契约层
    "rag-core",                 # workspace：检索内核（薄桥接）
    "cg-observability",         # workspace：日志 / 埋点
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_engine"]

[tool.uv.sources]
rag-contracts = { workspace = true }
rag-core = { workspace = true }
cg-observability = { workspace = true }
