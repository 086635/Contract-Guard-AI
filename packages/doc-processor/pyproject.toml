[project]
name = "doc-processor"
version = "1.1.0"
description = "文档解析与坐标抽取引擎（layout / ocr / parser / aligner）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3,<3.0",   # OcrSettings（CG_OCR_*）
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "cg-observability",              # 日志 / 埋点**唯一通道**（3-2 §⑥-7）
    # OCR & 印章定位
    "pillow>=10.0",
    "rapidocr-onnxruntime>=1.3,<2.0",
    "onnxruntime>=1.20",
    "pypdfium2>=5,<6",               # PDF → 图像（唯一渲染路径，禁止 pdf2image）
    "numpy>=1.26,<3.0",              # OCR 图像载体（BGR ndarray）
    "opencv-python>=4.8",            # 读图 / 后续印章检测（cv2）
]

[dependency-groups]
# ⚠️ pymupdf **只用于测试夹具生成**，不进运行期依赖（3-2 §⑥-8；生产渲染统一 pypdfium2）
dev = [
    "pymupdf>=1.24",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cg-observability = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["doc_processor"]
