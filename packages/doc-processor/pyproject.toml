[project]
name = "doc-processor"
version = "1.1.0"
description = "文档解析与坐标抽取引擎（layout / ocr / parser / aligner）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "paddleocr>=2.7",       # OCR & 印章定位
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doc_processor"]
