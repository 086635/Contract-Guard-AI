# 一键启动：API / Worker / Postgres / Qdrant / Redis / MinIO / Web
# 构建上下文为仓库根（context: .），各服务 Dockerfile 位于 docker/。
# 运行：docker compose -f docker/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cg
      POSTGRES_PASSWORD: cg
      POSTGRES_DB: cg
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cg"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      CG_POSTGRES_DSN: postgresql+asyncpg://cg:cg@postgres:5432/cg
      CG_REDIS_URL: redis://redis:6379/0
      CG_QDRANT_URL: http://qdrant:6333
      CG_MINIO_ENDPOINT: minio:9000
      CG_MINIO_ACCESS_KEY: minioadmin
      CG_MINIO_SECRET_KEY: minioadmin
      CG_CELERY_BROKER: redis://redis:6379/1
      CG_CELERY_BACKEND: redis://redis:6379/2
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      minio: { condition: service_started }

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      CG_POSTGRES_DSN: postgresql+asyncpg://cg:cg@postgres:5432/cg
      CG_REDIS_URL: redis://redis:6379/0
      CG_QDRANT_URL: http://qdrant:6333
      CG_MINIO_ENDPOINT: minio:9000
      CG_MINIO_ACCESS_KEY: minioadmin
      CG_MINIO_SECRET_KEY: minioadmin
      CG_CELERY_BROKER: redis://redis:6379/1
      CG_CELERY_BACKEND: redis://redis:6379/2
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      minio: { condition: service_started }
    command: ["uv", "run", "--package", "async-worker", "celery", "-A", "worker.main", "worker", "--loglevel=info"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports: ["5173:80"]
    depends_on: [api]

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]

volumes:
  pgdata:
  qdrantdata:
  miniodata:
