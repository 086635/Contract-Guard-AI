# 一键启动：API / Worker / Postgres / Qdrant / Redis / MinIO / Web
# 各服务 context 相对 compose 文件解析；构建上下文指向仓库根，Dockerfile 位于 docker/。
# 运行：docker compose -f docker/docker-compose.yml up -d
#
# ⚠️ 项目名必须显式固定：compose 默认用**文件所在目录名**作项目名，而本文件在 docker/ 下，
#    默认项目名就是 "docker" —— 与开发机上其它恰好也放在 docker/ 目录的 compose 项目
#    （例如 Dify：D:\Dify\dify\docker\docker-compose.yaml）**同处一个命名空间**，
#    会让 `up` 把对方容器当成 orphan、`down` 直接停掉对方的栈。显式命名即彻底隔离。
name: contract-guard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cg
      POSTGRES_PASSWORD: cg
      POSTGRES_DB: cg
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cg"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      # qdrant 镜像内无 curl/wget，只有 bash + grep（实测）；用 /dev/tcp 打 /readyz 取 200
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200' <&3
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Milvus standalone（T-A3 / `0-C2` 新增；备选向量库，见 `1-2` / `1.C5`）
  #   ⚠️ 依赖 etcd（元数据）+ minio（对象存储，复用下方已有服务）
  #   ⚠️ 与 qdrant 并存：qdrant 是默认/回退路径，milvus 是备选；都不改彼此的默认值
  #   起服务：docker compose -f docker/docker-compose.yml up -d etcd minio milvus
  #   接进 rag-core：CG_RAG_VECTOR_STORE=milvus + CG_RAG_MILVUS_URI=http://localhost:19530
  # ---------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes: ["etcddata:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.4          # ⚠️ 用具体小版本，勿用 latest
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000            # 复用 compose 已有的 minio 服务
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"                      # gRPC 业务端口（pymilvus 连接用）
      - "9091:9091"                        # 健康检查 / metrics
    volumes: ["milvusdata:/var/lib/milvus"]
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s                    # Milvus 启动较慢，给足冷启动时间

  minio:
    # ⚠️ 用 MinIO 官方 Quay 仓库：本机 Docker 走的 CN 加速器（daocloud/163/百度）
    #    对 Docker Hub 的 `minio/minio` 返回 `denied`（实测 2026-09-23），而 quay.io 直连可用。
    #    同一个官方镜像、同一条 `server /data` 命令、同样的 MINIO_* 环境变量，行为不变。
    image: quay.io/minio/minio:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["export MINIO_API_CORS_ALLOW_ORIGIN=$$(cat /config/minio-cors.json | tr -d '[]\"') && exec minio server /data --console-address ':9001'"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - "miniodata:/data"
      - "./minio-cors.json:/config/minio-cors.json:ro"
    healthcheck:
      # minio 镜像内有 curl（实测）；打 /minio/health/live
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ClamAV（C57 新增）：上传内容病毒扫描。worker 经 clamd INSTREAM 协议调用。
  #   ⚠️ 首次启动需下载病毒库（freshclam），healthcheck 的 start_period 给足 180s。
  #   ⚠️ 开发档默认 `CG_UPLOAD_AV_MODE=off`（不扫描）；生产档由 C67 prod profile 打开，
  #      且 api-gateway 启动门禁会拒绝 production+off。
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:stable
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes: ["clamdb:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  minio-init:
    # 幂等初始化：建 bucket；CORS 由 minio 服务从 C42 单一文件加载。
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/contracts"]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"
  # ---------------------------------------------------------------------------
  # 一次性数据库迁移（C24 新增；见 `4.C24Compose全栈与健康检查.md`）
  #   - 复用 api 镜像；启动前执行 `alembic upgrade head`
  #   - api / worker 依赖其 `service_completed_successfully`
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      CG_POSTGRES_DSN: postgresql+asyncpg://cg:cg@postgres:5432/cg
    command: ["uv", "run", "--package", "api-gateway", "alembic", "-c", "apps/api-gateway/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      CG_POSTGRES_DSN: postgresql+asyncpg://cg:cg@postgres:5432/cg
      CG_REDIS_URL: redis://redis:6379/0
      CG_QDRANT_URL: http://qdrant:6333
      # RAG 检索层（T-D8-1 / C76）：显式指向 compose 内 Qdrant（代码默认值是 inmemory）
      CG_RAG_VECTOR_STORE: qdrant
      CG_RAG_QDRANT_MODE: server
      CG_RAG_QDRANT_URL: http://qdrant:6333
      CG_MINIO_ENDPOINT: minio:9000
      CG_MINIO_PUBLIC_ENDPOINT: localhost:9000
      CG_MINIO_REGION: us-east-1
      CG_MINIO_ACCESS_KEY: minioadmin
      CG_MINIO_SECRET_KEY: minioadmin
      CG_CELERY_BROKER: redis://redis:6379/1
      CG_CELERY_BACKEND: redis://redis:6379/2
      # 上传内容扫描档位（C57）：开发默认 off；生产必须 clamav（启动门禁强制）
      CG_UPLOAD_AV_MODE: ${CG_UPLOAD_AV_MODE:-off}
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      # api 镜像内无 curl；用自带 python 打 /health（实测 200）
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 任务对账旁车（C63 / C75-C① P1-4）：按固定间隔调用既有 CLI（compose cron 方案）。
  #   与 api 同镜像（Dockerfile.api 已 COPY scripts/）；只读写 audit_tasks + 重派发，
  #   **不发布任何宿主端口**。间隔用 CG_RECONCILE_INTERVAL_S 覆盖（默认 60s）。
  #   退出码 0/1 都继续下一轮：1 表示本轮有任务被判 FAILED（日志留痕，不静默吞掉）。
  # ---------------------------------------------------------------------------
  reconciler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      CG_POSTGRES_DSN: postgresql+asyncpg://cg:cg@postgres:5432/cg
      CG_REDIS_URL: redis://redis:6379/0
      CG_QDRANT_URL: http://qdrant:6333
      CG_MINIO_ENDPOINT: minio:9000
      CG_MINIO_REGION: us-east-1
      CG_MINIO_ACCESS_KEY: minioadmin
      CG_MINIO_SECRET_KEY: minioadmin
      CG_CELERY_BROKER: redis://redis:6379/1
      CG_CELERY_BACKEND: redis://redis:6379/2
      CG_RECONCILE_INTERVAL_S: ${CG_RECONCILE_INTERVAL_S:-60}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    command:
      - sh
      - -c
      - >
        while true; do
          uv run --package api-gateway python scripts/reconcile_tasks.py;
          echo "reconcile exit=$$?";
          sleep "$${CG_RECONCILE_INTERVAL_S:-60}";
        done

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      CG_POSTGRES_DSN: postgresql+asyncpg://cg:cg@postgres:5432/cg
      CG_REDIS_URL: redis://redis:6379/0
      CG_QDRANT_URL: http://qdrant:6333
      CG_MINIO_ENDPOINT: minio:9000
      CG_MINIO_REGION: us-east-1
      CG_MINIO_ACCESS_KEY: minioadmin
      CG_MINIO_SECRET_KEY: minioadmin
      CG_CELERY_BROKER: redis://redis:6379/1
      CG_CELERY_BACKEND: redis://redis:6379/2
      # 上传内容扫描（C57）：档位 + clamd 地址（compose 服务名）
      CG_UPLOAD_AV_MODE: ${CG_UPLOAD_AV_MODE:-off}
      CG_CLAMAV_HOST: clamav
      CG_CLAMAV_PORT: "3310"
      # RAG 检索层（rag_core）：显式指向 compose 内 Qdrant（默认值是 inmemory）
      CG_RAG_VECTOR_STORE: qdrant
      CG_RAG_QDRANT_MODE: server
      CG_RAG_QDRANT_URL: http://qdrant:6333
      # LLM：默认离线档（接真实模型改 .env）
      CG_LLM_PROVIDER: offline
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_started }
    # 并发必须显式限制：prefork 默认 = 宿主 nproc（本机 24），会把 2 GiB 的 cgroup 撑爆（OOMKilled）
    command: ["uv", "run", "--package", "async-worker", "celery", "-A", "worker.main", "worker", "--concurrency=${CG_WORKER_CONCURRENCY:-2}", "--loglevel=info"]
    healthcheck:
      # 用 venv 内的 celery 直接 inspect ping（实测 pong）；C25 再补结果后端就绪验证
      test: ["CMD", "/app/.venv/bin/celery", "-A", "worker.main", "inspect", "ping", "--timeout", "3"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 预览转换 worker（C59）：只消费 `convert` 队列，与默认 worker 分离。
  #   镜像与 worker 相同（内含 LibreOffice）；命令用 `-Q convert` 限定队列。
  # ---------------------------------------------------------------------------
  worker-convert:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      CG_POSTGRES_DSN: postgresql+asyncpg://cg:cg@postgres:5432/cg
      CG_REDIS_URL: redis://redis:6379/0
      CG_QDRANT_URL: http://qdrant:6333
      CG_MINIO_ENDPOINT: minio:9000
      CG_MINIO_REGION: us-east-1
      CG_MINIO_ACCESS_KEY: minioadmin
      CG_MINIO_SECRET_KEY: minioadmin
      CG_CELERY_BROKER: redis://redis:6379/1
      CG_CELERY_BACKEND: redis://redis:6379/2
      # 转换队列名与超时（C59）
      CG_CELERY_CONVERT_QUEUE: convert
      CG_CONVERT_TIMEOUT_S: "120"
      CG_SOFFICE_BIN: soffice
      # 上传内容扫描（C57）：档位 + clamd 地址（compose 服务名）
      CG_UPLOAD_AV_MODE: ${CG_UPLOAD_AV_MODE:-off}
      CG_CLAMAV_HOST: clamav
      CG_CLAMAV_PORT: "3310"
      CG_RAG_VECTOR_STORE: qdrant
      CG_RAG_QDRANT_MODE: server
      CG_RAG_QDRANT_URL: http://qdrant:6333
      CG_LLM_PROVIDER: offline
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    command: ["uv", "run", "--package", "async-worker", "celery", "-A", "worker.main", "worker", "-Q", "convert", "--concurrency=${CG_CONVERT_CONCURRENCY:-1}", "--loglevel=info"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/celery", "-A", "worker.main", "inspect", "ping", "--timeout", "3"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports: ["5173:80"]
    depends_on: [api]

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]

volumes:
  pgdata:
  qdrantdata:
  miniodata:
  etcddata:
  milvusdata:
  clamdb:
