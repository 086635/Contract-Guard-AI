# =============================================================================
# 生产 nginx（C68）：TLS 终结 + 安全头 + 限流 + SSE 不缓冲
#
# 证书由**部署方**挂载到 /etc/nginx/certs（server.crt / server.key），仓库不提交任何证书。
# 用法见 docker/docker-compose.prod.yml（nginx.volumes 以 !override 指向本文件）。
# =============================================================================

# 请求体上限：与后端 MAX_UPLOAD_BYTES（50 MB，C56）保持一致
client_max_body_size 50m;

# 限流区（按客户端 IP；zone 内存 10m 足够单机私有化部署）
limit_req_zone $binary_remote_addr zone=cg_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cg_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cg_upload:10m rate=20r/m;

# -----------------------------------------------------------------------------
# HTTP → HTTPS（保留路径与查询串）
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS 主站
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CGSSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # 不回显 nginx 版本（⑥-3：错误页不暴露内部版本）
    server_tokens off;

    # ---- 安全头（最小白名单 CSP，禁止 *）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://minio.localhost:8443 https://127.0.0.1:9005 https://localhost:9005; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- 前端静态资源（SPA 由 web 服务做 history 回退）----
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SSE：任务进度订阅（长连接；**绝不缓冲、绝不 gzip**，§⑥-2 / §⑨-2）----
    location ~ ^/api/v1/tasks/[^/]+/stream$ {
        limit_req zone=cg_api burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- 上传：预签名与提交（更严格的限流）----
    location ~ ^/api/v1/contracts/(presign|upload)$ {
        limit_req zone=cg_upload burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 登录（最严格：防口令爆破）----
    location = /api/v1/auth/login {
        limit_req zone=cg_login burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 其余 API（统一反代 + 常规限流）----
    location /api/ {
        limit_req zone=cg_api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# -----------------------------------------------------------------------------
# C75 MinIO 同端口入口（推荐）：与 SPA 共用 8443，主机名 `minio.localhost`。
#   为什么：部分浏览器/代理策略会拒绝第二个端口（实测 9005 被 Chrome 直接
#   ERR_CONNECTION_REFUSED），而 `*.localhost` 按规范解析到回环，同一端口必然可达。
#   Host 头原样透传，确保 AWS SigV4 预签名校验通过。
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name minio.localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}

# -----------------------------------------------------------------------------
# C75 MinIO TLS 入口（备用）：浏览器直接访问 9005，内网 MinIO 仍走 HTTP。
# 保持 Host/路径不变，确保 AWS SigV4 预签名校验通过。
# -----------------------------------------------------------------------------
server {
    listen 9005 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
