server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PDF.js worker 是 ES module；nginx 默认 mime.types 不含 mjs，
    # 若返回 application/octet-stream，浏览器会拒绝动态 import。
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # SPA history fallback: dynamic routes must return index.html on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
