# ============================================================================
# pnpm 工作区定义（前端 / Schema 包）
# 本文件定义哪些子目录作为 pnpm 包被统一安装与构建。
# 后端 Python 包由仓库根 pyproject.toml（uv workspace）管理，此处不纳入。
# ============================================================================
packages:
  - 'packages/schema'     # SSOT 核心：OpenAPI + CodeGen 触发脚本
  - 'apps/web-ui'         # 前端 SPA（React + Vite + TS）
